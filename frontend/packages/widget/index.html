<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The widget frame. Its Content-Security-Policy, frame-ancestors included, is a response header the
      Widget stack's distribution sends (backend/lib/stacks/widget-stack.ts), generated from the hosts
      the deployment declares: a meta tag cannot carry frame-ancestors.
    -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/brand-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
